<!-- @dsCard group="WordPress Elements" height=960 subtitle="Figma: Blocks Card · 3 variants (State) + Show Gallery Icon" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BlocksCard</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var W = 296 + 32;
  var items = ['Default', 'Hover', 'Focus'].map(function (st) {
    return { label: st, width: W, node: h(NS.BlocksCard, { state: st, href: '#', onClick: function (e) { e.preventDefault(); } }) };
  });
  items.push({ label: 'Default, Show Gallery Icon = false', width: W, node: h(NS.BlocksCard, { showGalleryIcon: false }) });
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(I.SpecimenSection, { title: 'State',
      note: 'Built at 296px; fills its column (3-up from 800px, 2-up at 640–799px, 1-up below 640px, 16px gaps). The whole card is one link. Hover: border + 1px outside ring and headline in color/theme/primary. Focus: 2px color/gray/black outline, 1px out.' },
      h(I.Specimen, { items: items })));
</script>
</body>
</html>
