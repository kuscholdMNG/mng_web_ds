<!-- @dsCard group="WordPress Elements" height=420 subtitle="Figma: Latest Headlines List Item · 3 variants" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LatestHeadlinesListItem</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var types = ['First', 'Standard', 'Sponsored'];
  var variants = h(I.SpecimenSection, { title: 'Type', note: 'One headline in the Zone 1 Latest Headlines list, built to match production: the time sits inline after the headline; Standard and Sponsored draw the rule above themselves. Drawn at the Figma width (226px); the item fills its column.' },
    h(I.Specimen, { items: types.map(function (t) {
      return { label: 'Type=' + t, width: 226 + 32, node: h('div', { style: { width: 226 } }, h(NS.LatestHeadlinesListItem, { type: t })) };
    }) }));
  var wide = h(I.SpecimenSection, { title: 'In a wider column', note: 'At 640–799px the list is full width, so most headlines fit on one line with the time right after them (production, ocregister.com at 700px).' },
    h(I.Specimen, { items: [{ label: 'Type=Standard, 680px', width: 680 + 32, node: h('div', { style: { width: 680 } }, h(NS.LatestHeadlinesListItem, { type: 'Standard', headline: 'Make no bones about it, the giant skeleton has become an American Halloween fixture', time: '6 hours ago' })) }] }));
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null, variants, wide));
</script>
</body>
</html>
