<!-- @dsCard group="WordPress Elements" height=2960 subtitle="Figma: Zone 1 Lead Article Card · 6 variants (Style × Device × Gallery)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Zone1LeadArticleCard</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var stage = { Desktop: 706 + 32, Tablet: 358 + 32 + 391 + 32, Mobile: 340 + 32 };
  var notes = {
    Desktop: '1024px and up: text 295 | image 391 (20px gap), or text 295 | Zone 1 Slideshow 356 across the 706px card. Headline Noto Serif Bold 29/33.',
    Tablet: '640px and up (768 template): two 358px columns, 32px apart. The 391px image overflows its column (spec known issue 1); the slideshow fills it.',
    Mobile: 'Below 640px (and any lead narrower than about 700px): one column, 8px gaps, 25/29 headline; image under the headline, slideshow after the Related list; 1px color/gray/500 rule at the bottom. Built at 340px; fills its container.'
  };
  function section(dev) {
    var items = ['Image', 'Slideshow'].map(function (g) {
      return { label: 'Standard / ' + dev + ' / ' + g, width: stage[dev],
        node: h(NS.Zone1LeadArticleCard, { device: dev, gallery: g }) };
    });
    return h(I.SpecimenSection, { key: dev, title: 'Device=' + dev, note: notes[dev] }, h(I.Specimen, { items: items }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null, section('Desktop'), section('Tablet'), section('Mobile')));
</script>
</body>
</html>
