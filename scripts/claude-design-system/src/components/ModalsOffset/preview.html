<!-- @dsCard group="Core" height=3420 subtitle="Figma: ModalsOffset · 9 variants (Device × Location × Options)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ModalsOffset</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var opts = ['OneTapCTA', 'GOTcustom', 'AllOptions'];
  function section(device, location, note) {
    return h(I.SpecimenSection, { key: device, title: 'Device=' + device + ', Location=' + location, note: note },
      h(I.Specimen, { items: opts.map(function (o) {
        return { label: device + ' / ' + location + ' / ' + o, node: h(NS.ModalsOffset, { device: device, location: location, options: o, inline: true }) };
      }) }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    section('XLDesktop', 'Float', 'Desktop: 546px panel floating over the page, 24px padding, radius/utility. OneTapCTA = Sign in with Apple; GOTcustom = Google account chooser (Google’s UI, for reference); AllOptions = both.'),
    section('SMMobile', 'FixedFooter', 'Mobile 360: fixed to the bottom of the screen, 16px from each side (328px), 16px padding; the title keeps 32px on its right to clear the close button. Shown with inline: true.'),
    section('XSFold', 'FixedFooter', 'Fold 340: as SMMobile at 308px. Shown with inline: true.')));
</script>
</body>
</html>
