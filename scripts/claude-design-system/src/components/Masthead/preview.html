<!-- @dsCard group="WordPress Elements" height=3600 subtitle="Figma: Masthead · Page=Home, 20 of 90 variants" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Masthead</title>
<style>body{margin:0;padding:16px;background:var(--mng-color-gray-max);}</style></head>
<body>
<div id="root"></div>
<script>
  var NS = window.mng_web_design_system, h = React.createElement, I = NS._internal;
  var M = NS.Masthead;
  var devices = [['XL-Desktop', 1040, '1040px and up'], ['LG-TabletH', 1024, '800–1039px'], ['MD-TabletV', 768, '640–799px'], ['SM-Mobile', 360, 'below 640px, built 360'], ['XS-Fold', 340, 'below 640px, built 340']];
  function sec(state, note) {
    return h(I.SpecimenSection, { key: state, title: 'State=' + state + ', Page=Home', note: note },
      h(I.Specimen, { items: devices.map(function (d) {
        return { label: 'Device=' + d[0] + ' (' + d[2] + ')', width: d[1] + 32,
          node: h('div', { style: { width: d[1] } }, h(M, { state: state, device: d[0], user: { name: 'Gina Moreno' } })) };
      }) }));
  }
  function Demo() {
    var el = React.useState(null);
    return h('div', { ref: el[1], style: { height: 420, overflow: 'auto', background: 'var(--mng-color-gray-max)', boxShadow: 'inset 0 0 0 1px var(--mng-color-gray-500)' } },
      el[0] ? h(React.Fragment, null,
        h(M, { scrollRoot: el[0], scrollThreshold: 200 }),
        Array.from({ length: 30 }).map(function (_, i) {
          return h('p', { key: i, style: { margin: '0 24px 16px', fontFamily: 'var(--mng-font-family-noto-sans)', fontSize: 16, lineHeight: '24px', color: 'var(--mng-color-gray-200)' } },
            'Page content line ' + (i + 1) + '. Scroll this box: the condensed bar appears and sticks to the top.');
        })) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h(I.SpecimenSection, { title: 'Live: scroll behavior', note: 'The masthead takes its device from its width. Scroll the box: after the threshold (450px at 1040px and up in production, 200px here so the demo is short; 1px below 1040px) the condensed 64px bar sticks to the top with the color/gray/400 rule and shadow/masthead.' },
      h(I.Specimen, { items: [{ label: 'Anonymous reader, at the card width', width: '100%', node: h(Demo) }] })),
    sec('Default', 'Top of the page with ads (logged out or non-subscriber). At 1040px and up: menus row, weather / date / logo / Sponsorship 1 320x50, Top Nav (clipped at both edges when it overflows, as in production), Trending, Top Leaderboard 970x250. Below: one 64px row and the Top Leaderboard for the width.'),
    sec('AdFree', 'Top of the page for a subscriber: no ads; the avatar replaces Subscribe / Log In.'),
    sec('Scrolled', 'The sticky condensed bar once the reader scrolls (logged out): 64px, 1px color/gray/400 rule, shadow/masthead.'),
    sec('AdFree-Scrolled', 'The sticky condensed bar for a subscriber (added 2026-10-30).')));
</script>
</body>
</html>
